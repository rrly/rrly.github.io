<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — Live Effects Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <!-- Base layers -->
    <div id="scanline"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="placeholder">
      <div class="ph-icon">◉</div>
      <p class="ph-text">Webcam Required</p>
      <button id="init-btn" onclick="initCamera()">Initialize Camera</button>
    </div>

    <!-- UI overlays (all position:absolute, contained within stage) -->
    <header id="header">
      <div class="logo">PRISM <em>// EFFECTS STUDIO</em></div>
      <div id="live-badge"><div id="live-dot"></div><span id="live-text">OFFLINE</span></div>
    </header>

    <div id="mode-tag" class="show">
      <div id="mode-label">RAW</div>
      <div id="mode-sub">Unfiltered Feed</div>
    </div>

    <div id="hand-status">
      <div class="hs-row"><div class="hs-dot" id="hd0"></div><span>Hand 1</span></div>
      <div class="hs-row"><div class="hs-dot" id="hd1"></div><span>Hand 2</span></div>
    </div>

    <div id="scan-hint"><div class="sh-text">⊛ Raise your hands to the camera</div></div>

    <div id="fps">-- FPS</div>

    <div id="pixel-info">PIXEL: <span id="pxval">12</span>px · <span id="pxwins">0</span> win · +/- size · C clear</div>

    <div id="controls">
      <button class="btn active" data-mode="raw" onclick="setMode('raw')">
        <span class="btn-ico">◎</span><span class="btn-lbl">Raw</span>
      </button>
      <button class="btn" data-mode="sphere" onclick="setMode('sphere')">
        <span class="btn-ico">⊛</span><span class="btn-lbl">Sphere</span>
      </button>
      <button class="btn" data-mode="prism" onclick="setMode('prism')">
        <span class="btn-ico">◈</span><span class="btn-lbl">Prism</span>
      </button>
      <button class="btn" data-mode="glitch" onclick="setMode('glitch')">
        <span class="btn-ico">▦</span><span class="btn-lbl">Glitch</span>
      </button>
      <button class="btn" data-mode="pixelate" onclick="setMode('pixelate')">
        <span class="btn-ico">▤</span><span class="btn-lbl">Pixel</span>
      </button>
    </div>

    <!-- Hand-hover mode selection timer (positioned relative to stage) -->
    <div id="hover-timer">
      <svg viewBox="0 0 54 54">
        <circle class="ht-bg"  cx="27" cy="27" r="19"/>
        <circle class="ht-ring" cx="27" cy="27" r="19"/>
      </svg>
      <span id="ht-count">5</span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="script.js"></script>
</body>
</html>
